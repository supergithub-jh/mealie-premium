# Mealie Premium AI helper: tests and builds the helper's Docker image and publishes it to
# GitHub's container registry (ghcr.io/<you>/mealie-ai-helper).
#
# Release build: push a tag named ai-helper-vX.Y.Z -> image tag vX.Y.Z
# Test build:    Actions tab -> "AI helper image" -> Run workflow -> image tag dev-<commit>
name: AI helper image

on:
  push:
    tags:
      - "ai-helper-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-helper-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-helper
    steps:
      - name: Check out the fork
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the helper's tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Work out image name and version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/ai-helper-v* ]]; then
            echo "version=${GITHUB_REF_NAME#ai-helper-}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mealie-ai-helper" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ai-helper
          platforms: linux/amd64
          push: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.title=mealie-ai-helper
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Summary
        working-directory: .
        run: |
          echo "Published ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
